spring:
  application:
    name: rocket-credit-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/rocketcredit}
    username: ${DB_USER:rocket_app}
    password: ${DB_PASSWORD:rocket_app_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; JPA only checks it matches
    open-in-view: false    # no lazy loading in controllers; keeps threads from sharing sessions
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: RCSESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}   # true behind HTTPS
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always

rocket:
  address:
    evidence-directory: ${ADDRESS_EVIDENCE_DIR:${java.io.tmpdir}/rocket-credit-private}
  features:
    mode: ${FEATURES_MODE:SEQUENTIAL}        # SEQUENTIAL | PARALLEL (Step 7 experiment)
    pool-size: ${FEATURES_POOL_SIZE:3}
    queue-capacity: ${FEATURES_QUEUE_CAPACITY:50}
    deadline: ${FEATURES_DEADLINE:3s}
  analysis:
    base-url: ${ANALYSIS_URL:http://localhost:8000}
    shared-secret: ${ANALYSIS_SHARED_SECRET:}
    connect-timeout: ${ANALYSIS_CONNECT_TIMEOUT:2s}
    read-timeout: ${ANALYSIS_READ_TIMEOUT:5s}

logging:
  level:
    root: INFO
    com.rocketcredit.backend: INFO
    # Never raise these to DEBUG in a shared environment: they print request
    # bodies/headers, which may include passwords and session cookies.
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
