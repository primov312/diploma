services:

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - default

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb -p local/credit-repayment || true
      "
    networks:
      - default

  gateway:
    build:
      context: ..
      dockerfile: rocket-credit-gateway/Dockerfile
    image: rocket-credit-gateway:latest
    ports:
      - "8080:8080"          # host:container
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # IMPORTANT: use CONTAINER ports for in-network calls (all 8080 here)
      - USER_DATA_URL=http://user-data:8080
      - CREDIT_ANALYSIS_URL=http://credit-analysis:8080
      - PAYMENT_URL=http://payment:8080
      - REPAYMENT_URL=http://repayment:8080
      - NOTIFICATION_URL=http://notification:8080

      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123
      - S3_REGION=us-east-1
      - S3_BUCKET=credit-repayment

      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      - user-data
      - credit-analysis
      - payment
      - minio
      - minio-init
      # - repayment      # uncomment when you enable the service
      # - notification

  user-data:
    build:
      context: ..
      dockerfile: rocket-credit-user-data/Dockerfile
    image: rocket-credit-user-data:latest
    ports:
      - "8081:8080"
    depends_on:
      - userdb
      - minio
      - minio-init
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://userdb:5432/userdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - VK_CLIENT_ID=your_vk_app_id
      - VK_CLIENT_SECRET=your_vk_secret
      - META_CLIENT_ID=your_fb_app_id
      - META_CLIENT_SECRET=your_fb_secret
      - EMAIL_VERIFIER_API_KEY=your_hunter_io_key
      
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123
      - S3_REGION=us-east-1
      - S3_BUCKET=credit-repayment

      - KAFKA_BOOTSTRAP=kafka:9092

  userdb:
    image: postgres:15
    container_name: userdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    ports:
      - "5433:5432"

  credit-analysis:
    build:
      context: ..
      dockerfile: rocket-credit-analysis/Dockerfile
    image: rocket-credit-analysis:latest
    environment:
      - USER_DATA_URL=http://user-data:8080
      - SQLALCHEMY_URL=postgresql+psycopg://postgres:postgres@creditdb:5432/creditdb
      - APPROVE_THRESHOLD=0.60
      - PORT=8080 
      
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123
      - S3_REGION=us-east-1
      - S3_BUCKET=credit-repayment

      - KAFKA_BOOTSTRAP=kafka:9092
    ports:
      - "8082:8080"
    depends_on:
      - creditdb
      - minio
      - minio-init

  creditdb:
    image: postgres:15
    container_name: creditdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditdb
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d creditdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment:
    build:
      context: ../rocket-credit-payment
    image: rocket-credit-payment:latest
    env_file: .env
    depends_on:
      - paymentdb
      - minio
      - minio-init
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://paymentdb:5432/paymentdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres

  paymentdb:
    image: postgres:15
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"

