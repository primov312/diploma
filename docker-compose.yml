services:
  gateway:
    build:
      context: ../rocket-credit-gateway
      dockerfile: Dockerfile
    image: rocket-credit-gateway:latest
    ports:
      - "8080:8080"          # host:container
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # IMPORTANT: use CONTAINER ports for in-network calls (all 8080 here)
      - USER_DATA_URL=http://user-data:8080
      - CREDIT_ANALYSIS_URL=http://credit-analysis:8080
      - PAYMENT_URL=http://payment:8080
      - REPAYMENT_URL=http://repayment:8080
      - NOTIFICATION_URL=http://notification:8080
    depends_on:
      - user-data
      - credit-analysis
      # - payment
      # - repayment      # uncomment when you enable the service
      # - notification

  user-data:
    build:
      context: ../rocket-credit-user-data
      dockerfile: Dockerfile
    image: rocket-credit-user-data:latest
    ports:
      - "8081:8080"
    depends_on:
      - userdb
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://userdb:5432/userdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - VK_CLIENT_ID=your_vk_app_id
      - VK_CLIENT_SECRET=your_vk_secret
      - META_CLIENT_ID=your_fb_app_id
      - META_CLIENT_SECRET=your_fb_secret
      - EMAIL_VERIFIER_API_KEY=your_hunter_io_key

  userdb:
    image: postgres:15
    container_name: userdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    ports:
      - "5433:5432"

  credit-analysis:
    build:
      context: ../rocket-credit-analysis
      dockerfile: Dockerfile
    image: rocket-credit-analysis:latest
    environment:
      - USER_DATA_URL=http://user-data:8080
      - SQLALCHEMY_URL=postgresql+psycopg://postgres:postgres@creditdb:5432/creditdb
      - APPROVE_THRESHOLD=0.60
      - PORT=8080 
    ports:
      - "8082:8080"
    depends_on:
      - creditdb

  creditdb:
    image: postgres:15
    container_name: creditdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditdb
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d creditdb"]
      interval: 5s
      timeout: 3s
      retries: 20

