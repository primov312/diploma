services:
  gateway:
    build:
      context: ../rocket-credit-gateway
      dockerfile: Dockerfile
    image: rocket-credit-gateway:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - USER_DATA_URL=http://user-data:8081
      - CREDIT_ANALYSIS_URL=http://credit-analysis:8082
      - PAYMENT_URL=http://payment:8083
      - REPAYMENT_URL=http://repayment:8084
      - NOTIFICATION_URL=http://notification:8085

  user-data:
    build:
      context: ../rocket-credit-user-data
      dockerfile: Dockerfile
    image: rocket-credit-user-data:latest
    ports:
      - "8081:8080"
    depends_on:
      - userdb
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://userdb:5432/userdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  userdb:
    image: postgres:15
    container_name: userdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    ports:
      - "5433:5432"

