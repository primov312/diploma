openapi: 3.0.3
info:
  title: CreDIT User-Data API
  version: 1.0.0
  description: User profiles, transactions, payment methods, and credit reports.
servers:
  - url: http://localhost:8081
    description: Local user-data service

paths:
  /users:
    post:
      operationId: createUser
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      operationId: getUserById
      summary: Fetch a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      operationId: updateUser
      summary: Update an existing user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      operationId: deleteUser
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content

  /users/{id}/transactions:
    get:
      operationId: getUserTransactions
      summary: Fetch user's transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /users/{id}/payment-methods:
    get:
      operationId: getUserPaymentMethods
      summary: Fetch user's payment methods
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
  
  /users/{id}/credit-profile:
    get:
      operationId: getUserCreditProfile
      summary: Fetch aggregated credit profile and social insights
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Credit profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditProfile'
        '404':
          description: User not found

components:
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email

    NewUser:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    Transaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        date:
          type: string
          format: date
        amount:
          type: number
          format: double
        method:
          type: string

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
        last4:
          type: string

    
    CreditProfile:
      type: object
      description: Aggregated credit profile including derived social insights
      properties:
        userId:
          type: integer
          format: int64
        annualIncome:
          type: number
          format: double
        creditBureauScore:
          type: integer
        numTransactions:
          type: integer
        totalSpent:
          type: number
          format: double
        avgTransactionAmount:
          type: number
          format: double
        onTimePaymentRate:
          type: number
          format: double
          description: Derived proxy for on-time payments (0 - 1)
        numPaymentMethods:
          type: integer
        numActiveBnpl:
          type: integer
          description: Number of active BNPL plans
        socialInsights:
          $ref: '#/components/schemas/SocialInsights'

    SocialInsights:
      type: object
      description: Basic social media insights
      properties:
        jobStabilityScore:
          type: integer
          description: Derived from LinkedIn (mock 0 - 100)
        networkQuality:
          type: integer
          description: Proxy for quality of connections
        activitySentiment:
          type: number
          format: double
          description: Sentiment score of recent activity (0 - 1)

